<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="VibeML logo">
  <title>VibeML</title>
  <defs>
    <clipPath id="eL"><ellipse cx="79" cy="104" rx="18" ry="16"/></clipPath>
    <clipPath id="eR"><ellipse cx="123" cy="104" rx="18" ry="16"/></clipPath>
  </defs>

  <g stroke="#1a1a1a" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- 左耳：直立，驴的桨形（宽） -->
    <path d="M80 78 C66 50 62 18 74 7 C90 1 104 22 105 52 C106 66 101 74 97 80 Z" fill="#9aa4b2"/>
    <path d="M83 68 C73 46 71 24 77 16 C86 14 94 32 95 54 C95 64 92 68 90 71 Z"
          fill="#dca09a" stroke-width="3"/>

    <!-- 右耳：中段折垂 -->
    <path d="M118 74 C124 48 142 20 162 22 C178 30 172 56 148 68 C136 75 122 77 117 75 Z" fill="#9aa4b2"/>
    <path d="M123 66 C130 46 145 29 159 31 C168 37 160 54 143 62 C135 66 126 67 123 67 Z"
          fill="#dca09a" stroke-width="3"/>

    <!-- 头：长脸 -->
    <path d="M100 58
             C130 58 152 76 152 101
             C152 117 146 129 139 137
             C137 153 133 171 123 181
             C116 189 104 191 100 191
             C96 191 84 189 77 181
             C67 171 63 153 61 137
             C54 129 48 117 48 101
             C48 76 70 58 100 58 Z" fill="#9aa4b2"/>

    <!-- 额前鬃毛 -->
    <path d="M86 68 L92 46 L99 62 L105 44 L112 64 L117 50 L120 72" fill="#7a8595" stroke-width="3.5"/>

    <!-- 吻部与腮 -->
    <path d="M100 130
             C124 130 137 138 137 150
             C137 160 130 166 122 169
             C119 181 110 190 100 190
             C90 190 81 181 78 169
             C70 166 63 160 63 150
             C63 138 76 130 100 130 Z" fill="#f0ece4"/>
  </g>

  <!-- 鼻：宽扁 + 鼻孔 -->
  <path d="M100 138 C108 138 113 142 113 147 C113 152 107 155 100 155
           C93 155 87 152 87 147 C87 142 92 138 100 138 Z"
        fill="#6b6360" stroke="#1a1a1a" stroke-width="4"/>
  <ellipse cx="94.5" cy="147" rx="2.3" ry="3.2" fill="#1a1a1a"/>
  <ellipse cx="105.5" cy="147" rx="2.3" ry="3.2" fill="#1a1a1a"/>

  <!-- 嘴：一条线，单侧上挑的坏笑 -->
  <path d="M100 155 L100 163" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 170 C88 177 106 177 118 166 C121 163 123 160 124 157" fill="none"
        stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 腮上胡点 -->
  <g fill="#1a1a1a">
    <circle cx="77" cy="150" r="2.1"/><circle cx="72" cy="158" r="2.1"/>
    <circle cx="123" cy="150" r="2.1"/><circle cx="128" cy="158" r="2.1"/>
  </g>

  <!-- 眼睛：厚眼睑压到六成，瞳孔小而居中 -->
  <g>
    <ellipse cx="79" cy="104" rx="18" ry="16" fill="#f7f5f0"/>
    <ellipse cx="123" cy="104" rx="18" ry="16" fill="#f7f5f0"/>
    <ellipse cx="80" cy="112" rx="6" ry="6.6" fill="#1a1a1a"/>
    <ellipse cx="124" cy="112" rx="6" ry="6.6" fill="#1a1a1a"/>

    <g clip-path="url(#eL)">
      <path d="M58 84 H100 V104 C90 100 68 102 58 108 Z" fill="#9aa4b2"/>
    </g>
    <g clip-path="url(#eR)">
      <path d="M102 84 H144 V108 C134 102 112 100 102 104 Z" fill="#9aa4b2"/>
    </g>
    <path d="M60 107 C70 101 90 99 99 104" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M103 104 C112 99 132 101 142 107" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>

    <ellipse cx="79" cy="104" rx="18" ry="16" fill="none" stroke="#1a1a1a" stroke-width="4.5"/>
    <ellipse cx="123" cy="104" rx="18" ry="16" fill="none" stroke="#1a1a1a" stroke-width="4.5"/>
  </g>
</svg>
