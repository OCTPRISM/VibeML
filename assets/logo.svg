<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="VibeML logo">
  <title>VibeML</title>
  <g stroke="#2b2b2e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">

    <!-- 左耳：长，向左横伸并微垂 -->
    <path d="M74 94 C58 80 32 66 15 68 C5 72 8 85 25 93 C45 102 66 103 76 99 Z" fill="#8f949c"/>
    <path d="M70 94 C56 83 36 73 24 75 C19 78 23 86 35 91 C50 97 64 97 71 95 Z"
          fill="#b0b5bc" stroke-width="2.6"/>

    <!-- 右耳：长，向右上扬 -->
    <path d="M126 74 C134 54 152 26 168 17 C178 14 182 26 174 44 C164 64 146 80 132 86 Z" fill="#8f949c"/>
    <path d="M131 74 C138 58 152 36 164 29 C170 28 170 37 164 49 C156 64 142 77 133 81 Z"
          fill="#b0b5bc" stroke-width="2.6"/>

    <!-- 头：颅骨高，吻部下探 -->
    <path d="M100 42
             C124 42 142 56 145 80
             C147 94 145 104 142 114
             C140 136 134 158 122 172
             C113 182 103 186 97 186
             C91 186 81 182 73 172
             C61 158 56 136 54 114
             C51 104 49 94 51 80
             C54 56 76 42 100 42 Z" fill="#8f949c"/>

    <!-- 额前鬃毛：矮而碎 -->
    <path d="M81 56 L86 41 L92 52 L97 34 L104 49 L110 37 L116 51 L122 57" fill="#71767e" stroke-width="2.8"/>

    <!-- 腮边碎毛 -->
    <path d="M55 104 L46 100 M54 118 L45 117 M57 132 L48 134" fill="none" stroke-width="3.2"/>
    <path d="M144 102 L153 98 M145 116 L154 115 M142 130 L151 132" fill="none" stroke-width="3.2"/>

    <!-- 吻部：下移、收窄、略倾 -->
    <g transform="rotate(-8 100 146)">
      <path d="M100 106 C122 106 135 121 135 145
               C135 169 120 185 100 185 C80 185 65 169 65 145
               C65 121 78 106 100 106 Z" fill="#d9dbde"/>
    </g>
  </g>

  <!-- 鼻孔：逗号形，向外下倾斜（参考图的识别特征）-->
  <g transform="rotate(-8 100 146)">
    <path d="M93 121 C99 125 99 135 93 142 L85 147 C81 143 81 131 86 124 C88 120 91 119 93 121 Z"
          fill="#3a3a3e"/>
    <path d="M120 119 C126 123 126 133 120 140 L112 145 C108 141 108 129 113 122 C115 118 118 117 120 119 Z"
          fill="#3a3a3e"/>
    <!-- 嘴：长弧，右端上挑 -->
    <path d="M75 157 C88 166 108 165 121 153 C124 150 126 147 127 144"
          fill="none" stroke="#2b2b2e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 胡须 -->
  <g stroke="#2b2b2e" stroke-width="2.3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M64 140 L52 142"/><path d="M66 150 L55 155"/>
    <path d="M136 136 L148 137"/><path d="M134 146 L145 150"/>
  </g>

  <!-- 眼睛：上移、半眯、厚眼睑 -->
  <g>
    <path d="M68 90 C74 80 92 78 97 88 C91 95 75 96 68 90 Z" fill="#f5f6f7"
          stroke="#2b2b2e" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M105 84 C111 74 129 73 134 83 C128 90 112 91 105 84 Z" fill="#f5f6f7"
          stroke="#2b2b2e" stroke-width="3.4" stroke-linejoin="round"/>
    <ellipse cx="86" cy="89" rx="4.8" ry="5.4" fill="#222326"/>
    <ellipse cx="123" cy="84" rx="4.8" ry="5.4" fill="#222326"/>
    <path d="M68 90 C74 80 92 78 97 88" fill="none" stroke="#2b2b2e" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M105 84 C111 74 129 73 134 83" fill="none" stroke="#2b2b2e" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M66 79 C74 71 92 69 99 77" fill="none" stroke="#2b2b2e" stroke-width="2.8" opacity="0.75"/>
    <path d="M103 73 C111 65 129 64 136 72" fill="none" stroke="#2b2b2e" stroke-width="2.8" opacity="0.75"/>
  </g>
</svg>
