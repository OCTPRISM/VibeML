<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="VibeML logo">
  <title>VibeML</title>
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9aa3b2"/>
      <stop offset="100%" stop-color="#6c7482"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cfd5de"/>
      <stop offset="100%" stop-color="#aeb6c2"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="80" cy="80" r="76"/></clipPath>
  </defs>

  <circle cx="80" cy="80" r="76" fill="#1c2129"/>

  <g clip-path="url(#badge)">
    <!-- 训练曲线：贴着底部走，整条收在圆内 -->
    <path d="M6 134 q20 -9 34 -2 q14 7 26 -6 q12 -13 28 -16 q22 -5 60 -22"
          fill="none" stroke="#e8a33d" stroke-width="4"
          stroke-linecap="round" opacity="0.5"/>

    <!-- 长耳 -->
    <ellipse cx="50"  cy="42" rx="12.5" ry="30" fill="url(#coat)" transform="rotate(-15 50 42)"/>
    <ellipse cx="50"  cy="44" rx="6"    ry="21" fill="#4a5260"   transform="rotate(-15 50 44)"/>
    <ellipse cx="110" cy="42" rx="12.5" ry="30" fill="url(#coat)" transform="rotate(15 110 42)"/>
    <ellipse cx="110" cy="44" rx="6"    ry="21" fill="#4a5260"   transform="rotate(15 110 44)"/>

    <!-- 头部 -->
    <path d="M80 48 c22 0 34 14 34 33 c0 12 -3 21 -8 28
             c-5 7 -14 11 -26 11 c-12 0 -21 -4 -26 -11
             c-5 -7 -8 -16 -8 -28 c0 -19 12 -33 34 -33 z" fill="url(#coat)"/>

    <!-- 额前鬃毛 -->
    <path d="M80 48 c-7 0 -12 -5 -11 -11 c4 4 7 5 11 5 c4 0 7 -1 11 -5 c1 6 -4 11 -11 11 z" fill="#4a5260"/>

    <!-- 口鼻 -->
    <ellipse cx="80"   cy="113" rx="25" ry="19"  fill="url(#muzzle)"/>
    <ellipse cx="70.5" cy="109" rx="4"  ry="5.5" fill="#3a414e"/>
    <ellipse cx="89.5" cy="109" rx="4"  ry="5.5" fill="#3a414e"/>
    <path d="M68 123 q12 7 24 0" fill="none" stroke="#3a414e" stroke-width="3" stroke-linecap="round"/>

    <!-- 眼睛 -->
    <ellipse cx="62" cy="80" rx="6.5" ry="7.5" fill="#1c2129"/>
    <ellipse cx="98" cy="80" rx="6.5" ry="7.5" fill="#1c2129"/>
    <circle cx="64"  cy="77.5" r="2.4" fill="#eef1f5"/>
    <circle cx="100" cy="77.5" r="2.4" fill="#eef1f5"/>
  </g>

  <circle cx="80" cy="80" r="76" fill="none" stroke="#2d3440" stroke-width="3"/>
</svg>
